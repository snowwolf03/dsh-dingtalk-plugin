name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Host and preset tests
        run: node --test test/host.test.mjs test/session-preset.test.mjs
      - name: Client registration harness
        run: node test/client.harness.mjs
